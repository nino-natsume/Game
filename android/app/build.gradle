plugins {
    id 'com.android.application'
}

android {
    namespace 'com.eri.gameapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.eri.gameapp"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            // 本地/CI 直出可安装 APK:先用 debug 签名;正式分发时换成自己的 keystore
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}