name: Build Mobile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/build-apk.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle 8.7
        run: |
          if [ ! -x /opt/gradle-8.7/bin/gradle ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
          fi
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-center-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  ios:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build simulator app (no signing)
        working-directory: ios
        run: |
          xcodebuild -project GameCenter.xcodeproj -scheme GameCenter \
            -configuration Debug -sdk iphonesimulator -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package simulator app
        run: |
          mkdir -p ios/output
          cd ios/build/Build/Products/Debug-iphonesimulator
          zip -rq GameCenter-simulator.zip GameCenter.app
          mv GameCenter-simulator.zip ../../../output/

      - name: Import signing certificate
        if: ${{ secrets.IOS_CERT_BASE64 != '' }}
        env:
          IOS_CERT_BASE64: ${{ secrets.IOS_CERT_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          echo "$IOS_CERT_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k temp build.keychain

      - name: Install provisioning profile
        if: ${{ secrets.IOS_PROVISION_BASE64 != '' }}
        env:
          IOS_PROVISION_BASE64: ${{ secrets.IOS_PROVISION_BASE64 }}
        run: |
          echo "$IOS_PROVISION_BASE64" | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Build signed IPA (requires cert secrets)
        if: ${{ secrets.IOS_CERT_BASE64 != '' }}
        working-directory: ios
        run: |
          xcodebuild -project GameCenter.xcodeproj -scheme GameCenter \
            -configuration Release -archivePath build/GameCenter.xcarchive \
            -allowProvisioningUpdates archive
          xcodebuild -exportArchive \
            -archivePath build/GameCenter.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath output

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ios/output/*
          if-no-files-found: warn

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-files
          pattern: '*'

      - name: Collect release assets
        run: |
          mkdir -p assets
          cp release-files/game-center-apk/* assets/ 2>/dev/null || true
          cp release-files/ios-app/* assets/ 2>/dev/null || true
          ls -la assets/

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --repo "${{ github.repository }}" || true
          if [ -z "$(ls -A assets/)" ]; then echo "::error::No release assets found"; exit 1; fi
          gh release create apk-latest --repo "${{ github.repository }}" \
            --title "次元星域游戏中心" \
            --notes "自动构建 $(date -u +%Y-%m-%dT%H:%M:%SZ) | Android: app-release.apk(可直接安装), iOS: 配置签名证书后自动附带 GameCenter.ipa" \
            assets/*