name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle 8.7
        run: |
          if [ ! -x /opt/gradle-8.7/bin/gradle ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
          fi
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-center-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --repo "${{ github.repository }}" || true
          gh release create apk-latest --repo "${{ github.repository }}" \
            --title "次元星域游戏中心 APK" \
            --notes "自动构建于 $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            android/app/build/outputs/apk/release/app-release.apk